[package]
name = "pri"
version = "0.3.0"
edition = "2021"
description = "Reads, writes and builds Windows resources.pri files, on any platform"
license = "MIT"
repository = "https://github.com/iSimonWeb/pri-rs"
keywords = ["windows", "msix", "pri", "resources"]
categories = ["command-line-utilities", "parser-implementations"]
publish = false

[lib]
name = "pri"
path = "src/lib.rs"

[[bin]]
name = "pri"
path = "src/main.rs"
# The lib and the bin share a name; only the lib gets docs.
doc = false

# No dependencies: std only.
